version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e MONGODB_URI -e ENCRYPTION_KEY -e GITHUB_TOKEN -e GITHUB_REPO -e GITHUB_BRANCH -e SHOPIFY_CLIENT_ID -e SHOPIFY_CLIENT_SECRET -e GEMINI_API_KEY -e GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET -e META_APP_ID -e META_APP_SECRET >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
